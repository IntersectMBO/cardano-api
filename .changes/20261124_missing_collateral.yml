project: cardano-api
pr: 1426
kind:
  - bugfix
  - breaking
description: Experimental transaction balancing now rejects missing collateral inputs when the top-level transaction or a Dijkstra sub-transaction runs Plutus scripts. Handle the new MissingCollateralInputs constructor of the shared CollateralError type in exhaustive matches; it reports top-level Plutus witness indices and sub-transaction witness indices grouped by transaction ID. Only the experimental balancing API produces this error; the old balancing API does not run the new check. Transactions without Plutus scripts continue to balance without collateral.
