project: cardano-api
pr: 1363
kind:
  - breaking
  - bugfix
description: |
  A `PlutusScriptInEra` can now only be built from a `PlutusLangInEra lang era` proof that the era supports the script language.
  The proof is a single-constructor GADT that holds the language singleton, and its context is the ledger's `EraPlutusTxInfo lang era` class, so cardano-api holds no table of its own.
  So you cannot put a Plutus script in an experimental transaction if the era does not support its language.
  Before, such a script was silently dropped from the witness set while its redeemer was kept, so the transaction failed on submission.
  The check happens once at deserialisation: `decodeAnyPlutusScript`, `deserialiseAnyPlutusScriptFromTextEnvelope` and the `SerialiseAsCBOR` instance for `AnyScript` reject an unsupported language.
  The `SerialiseAsCBOR` and `HasTextEnvelope` instances of `PlutusScriptInEra` exist only for language and era pairings the ledger supports, so a wrong pairing is a compile error.
  `PlutusScriptInEra` now holds the ledger script next to the runnable, built by the new `mkPlutusScriptInEra` function.
  `mkPlutusScriptInEra`, `deserialisePlutusScriptInEra` and `deserialiseAnyPlutusScriptOfLanguage` take the ledger's `EraPlutusTxInfo lang era` constraint and cannot fail on the language.
  The new `plutusLangInShelleyBasedEra` function and the new `HasPlutusLangInEra` class give this proof to code that learns the language only at runtime.
  They ask the ledger's `mkSupportedLanguage`, so cardano-api keeps no table at runtime either.
  `deserialisePlutusScriptInEra` and `deserialiseAnyPlutusScriptOfLanguage` no longer take the language singleton.
  `EraCommonConstraints` now includes `HasPlutusLangInEra (LedgerEra era)`.
