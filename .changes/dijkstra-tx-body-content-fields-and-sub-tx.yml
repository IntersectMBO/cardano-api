project: cardano-api
pr: 1361
kind:
  - breaking
  - feature
description: Renamed `Cardano.Api.Experimental.Tx.Internal.BodyContent.New` to `Cardano.Api.Experimental.Tx.Internal.BodyContent` and made body content one type, `BodyContent l era`, indexed by the ledger transaction level, with the fields that exist only in a top-level body kept in a `TopTxOnlyFields` GADT. `TxBodyContent era` and `SubTxBodyContent era` are type synonyms for the two levels and record pattern synonyms of the same names present each as a flat record, so existing `TxBodyContent` field access and record updates are unchanged; `TxBodyContent (..)` imports become `BodyContent (..)` plus the field names. Setters of shared fields are typed `BodyContent l era` and work on both levels; the eight top-level-only setters keep their `TxBodyContent era` type. Added the Dijkstra-era fields to the experimental body content (`txGuards`, `txSubTransactions`, `txRequiredTopLevelGuards`, `txDirectDeposits`, `txAccountBalanceIntervals`, `txStartingAccountBalanceIntervals`) and populated all of them when building a Dijkstra transaction body. Added `Cardano.Api.Experimental.Tx.Internal.SubTransaction` with `UnsignedSubTx` and `SignedSubTx` (fixed to the Dijkstra era, the only era with sub-transactions), construction and signing from `SubTxBodyContent` (`makeUnsignedSubTx`, `makeSubTxKeyWitness`, `signSubTx`, `makeSignedSubTx`), `SerialiseAsCBOR` and `HasTextEnvelope` instances (`Unwitnessed SubTx DijkstraEra` / `Witnessed SubTx DijkstraEra`), `getUnsignedSubTxId`/`getSignedSubTxId` and `setTxSignedSubTransactions`; all re-exported from `Cardano.Api.Experimental.Tx` and `Cardano.Api.Experimental` together with `DijkstraEra`.
