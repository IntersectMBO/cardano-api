project: cardano-api
pr: 1361
kind:
  - breaking
  - feature
description: |
  Renamed `Cardano.Api.Experimental.Tx.Internal.BodyContent.New` to `Cardano.Api.Experimental.Tx.Internal.TopTx.BodyContent`. Added the Dijkstra-era fields to the experimental `TxBodyContent` (`txGuards`, `txSubTransactions`, `txRequiredTopLevelGuards`, `txDirectDeposits`, `txAccountBalanceIntervals`, `txStartingAccountBalanceIntervals`) and populated all of them when building a Dijkstra transaction body. Added `Cardano.Api.Experimental.Tx.Internal.SubTransaction` with `SubTx` content, `UnsignedSubTx` and `SignedSubTx` (indexed by the API era), construction and signing (`makeUnsignedSubTx`, `makeSubTxKeyWitness`, `signSubTx`, `makeSignedSubTx`), `SerialiseAsCBOR` and `HasTextEnvelope` instances (`Unwitnessed SubTx DijkstraEra` / `Witnessed SubTx DijkstraEra`), `getUnsignedSubTxId`/`getSignedSubTxId`, `unsignedSubTxFromSomeTypes`/`signedSubTxFromSomeTypes` and `setTxSignedSubTransactions`; all re-exported from `Cardano.Api.Experimental.Tx` and `Cardano.Api.Experimental` together with the Dijkstra `TxBodyContent` setters and `DijkstraEra`.
