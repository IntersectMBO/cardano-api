project: cardano-api
pr: 1402
kind:
  - feature
  - breaking
description: Dijkstra automatic balancing now supports signed sub-transactions while preserving their bodies and budgets, and script evaluation includes sub-transaction context. `getAllTxInputs` returns spending, reference and collateral inputs from the top level and its sub-transactions; `getAllTxCertificates` returns their certificates. Pass these results to `queryStateForBalancedTx` to obtain the UTxO, deposit and pool state needed for balancing. An incomplete UTxO now fails early for both Conway and Dijkstra; duplicate spending inputs across the top-level transaction and its sub-transactions are also rejected. Balancing validates signed sub-transactions; rebuild and re-sign those that need corrected budgets or outputs. Update exhaustive handlers for `TxBodyErrorAutoBalance` to cover `TxBodyErrorMissingInputs`, `TxBodyErrorDuplicateSpendingInputs`, `TxBodyErrorTopLevelExecutionUnitsTooBig`, `TxBodyErrorTopLevelScriptContexts`, `TxBodyErrorTopLevelScriptFailures` and `TxBodyErrorLegacyTopLevelBalance`. Script failures include `ScriptFailureSource` (`TopLevelTransaction` or `SubTransaction TxId`) and script diagnostics; execution-budget errors include used and maximum units, and legacy-balance errors include the remaining balance. Export `ada` from `Cardano.Api.Value` to convert whole ada amounts to ledger `MaryValue` values.
