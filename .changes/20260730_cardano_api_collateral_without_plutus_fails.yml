project: cardano-api
pr: 1274
kind:
  - breaking
description: |
  Since #1265, `makeTransactionBodyAutoBalance` and `estimateBalancedTxBody` (both the traditional and the experimental versions) silently remove the collateral inputs from transactions without Plutus scripts. From this PR, instead of silently dropping the collateral inputs, it fails with the new `CollateralWithoutPlutusScripts` error. The ledger requires collateral only for transactions that run Plutus scripts and ignores it otherwise: the collateral inputs would only cost fees and require the collateral UTxOs to stay unspent, so they are most likely a mistake.
