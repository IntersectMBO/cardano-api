name: Haskell CI

on:
  merge_group:
  pull_request:
  push:
    # we need this to populate cache for `master` branch to make it available to the child branches, see
    # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
    branches:
      - master
  # GH caches are removed when not accessed within 7 days - this schedule runs the job every 6 days making
  # sure that we always have some caches on master
  schedule:
    - cron: '0 0 */6 * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        ghc: [&ghc-stable "9.6", "9.10", &ghc-latest "9.12", "9.14"]
        cabal: [&cabal-version "3.16"]
        os: [ubuntu-latest]
        include:
          # Using include, to make sure there will only be one macOS job, even if the matrix gets expanded later on.
          # We want a single job, because macOS runners are scarce.
          - ghc: *ghc-stable
            cabal: *cabal-version
            os: macos-latest
          - ghc: *ghc-latest
            cabal: *cabal-version
            os: windows-latest

    defaults:
        run:
          shell: bash

    env:
      # Modify this value to "invalidate" the cabal cache.
      CABAL_CACHE_VERSION: "2026-06-26"

    concurrency:
      group: >
        a+${{ github.event_name }}
        b+${{ github.workflow_ref }}
        c+${{ github.job }}
        d+${{ matrix.ghc }}
        e+${{ matrix.cabal }}
        f+${{ matrix.os }}
        g+${{ (startsWith(github.ref, 'refs/heads/gh-readonly-queue/') && github.run_id) || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
    - name: Concurrency group
      env:
        GROUP: >
          a+${{ github.event_name }}
          b+${{ github.workflow_ref }}
          c+${{ github.job }}
          d+${{ matrix.ghc }}
          e+${{ matrix.cabal }}
          f+${{ matrix.os }}
          g+${{ (startsWith(github.ref, 'refs/heads/gh-readonly-queue/') && github.run_id) || github.event.pull_request.number || github.ref }}
      run: echo "$GROUP"

    - name: "[macOS] Use the default Xcode's toolchain and SDK"
      if: runner.os == 'macOS'
      # The macos-26 image 20261013.0424 updated the Command Line Tools to 27.0, whose
      # macOS 27 SDK the default Xcode's linker cannot read ("tapi error: malformed file",
      # "unknown architecture arm64e.x1-macos"). Builds still reach that SDK through
      # the Command Line Tools' MacOSX.sdk link even with SDKROOT set, so point that
      # link at the default Xcode's SDK too. Remove once the image's toolchain and
      # SDK match again.
      run: |
        developer_dir=/Applications/Xcode.app/Contents/Developer
        sdkroot="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-path)"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
        echo "xcode-select -p: $(xcode-select -p)"
        echo "Using DEVELOPER_DIR=$developer_dir SDKROOT=$sdkroot"
        DEVELOPER_DIR="$developer_dir" xcrun ld -v 2>&1 | head -1
        clt_sdk=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
        ls -l /Library/Developer/CommandLineTools/SDKs/
        if [ -e "$clt_sdk" ] || [ -L "$clt_sdk" ]; then
          sudo mv "$clt_sdk" "$clt_sdk.ci-original"
        fi
        sudo ln -s "$sdkroot" "$clt_sdk"
        echo "$clt_sdk -> $(readlink "$clt_sdk")"

    - name: Install Haskell
      uses: input-output-hk/actions/haskell@fc5641d3c3a9d5941bbad5a623236d799b521d9f # latest
      id: setup-haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}

    - name: Install system dependencies
      uses: input-output-hk/actions/base@fc5641d3c3a9d5941bbad5a623236d799b521d9f # latest
      with:
        use-sodium-vrf: true # default is true

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Install gRPC system dependencies
      uses: input-output-hk/cardano-dev/actions/grpc-deps@7bd271fb5d71f95250fc82bf433605b787dad3d4 # grpc-deps-0.1.0.0

    - name: Cache and install Cabal dependencies
      uses: input-output-hk/cardano-dev/actions/cabal-cache@c7427b0921301778971d96b20ab234e8c34aedc3 # cabal-cache-0.0.1.2
      with:
        cabal-store: ${{ steps.setup-haskell.outputs.cabal-store }}
        cache-version: ${{ env.CABAL_CACHE_VERSION }}

    # Now we build.
    - name: Build all
      run: cabal build all --enable-tests

    - name: Run tests
      env:
        TMPDIR: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
        KEEP_WORKSPACE: 1
      run: cabal test all --enable-tests --test-show-details=direct

    - name: Collect Windows build failure diagnostics
      if: failure() && runner.os == 'Windows'
      id: windows-diagnostics
      shell: pwsh
      run: |
        $logs = (cabal path --logs-dir | Select-Object -Last 1).Trim()
        "logs=$logs" >> $env:GITHUB_OUTPUT
        Get-ChildItem $logs -Recurse -Filter 'plutus-core-*.log' | ForEach-Object {
          Write-Output "::group::$($_.Name)"
          Get-Content $_.FullName -Tail 200
          Write-Output '::endgroup::'
        }
        Get-WinEvent -FilterHashtable @{
          LogName = 'Application'
          Id = 1000, 1001
          StartTime = (Get-Date).AddHours(-2)
        } -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

    - name: Upload Windows Cabal logs
      if: failure() && runner.os == 'Windows'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-cabal-logs-ghc-${{ matrix.ghc }}
        path: ${{ steps.windows-diagnostics.outputs.logs }}
        if-no-files-found: warn

    # Uncomment the following back in for debugging. Remember to launch a `pwsh` from
    # the tmux session to debug `pwsh` issues.
    #
    # - name: Setup tmate session
    #   if: ${{ failure() }}
    #   uses: mxschmitt/action-tmate@v3
    #   with:
    #      limit-access-to-actor: true

  check-proto-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            allow-import-from-derivation = true

      - uses: rrbutani/use-nix-shell-action@59a52b2b9bbfe3cc0e7deb8f9059abe37a439edf # v1.1.0

      - name: Regenerate protobuf code
        working-directory: cardano-rpc
        run: buf generate proto

      - name: Check that generated files from proto definitions are up to date
        run: |
          git add cardano-rpc/gen
          if ! git diff --staged --quiet -- cardano-rpc/gen; then
            echo "Generated files differ from repository files:"
            git diff --staged --name-status -- cardano-rpc/gen
            exit 1
          fi
          echo "All generated files match repository files"

  build-complete:
    needs: [build, check-proto-gen]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Check if any previous job failed
      run: |
        if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.check-proto-gen.result }}" == "failure" ]]; then
          # this ignores skipped dependencies
          echo 'Required jobs failed to build.'
          exit 1
        else
          echo 'Build complete'
        fi
